<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Click Handler</title>
    <style>
        .chat-thread-item {
            padding: 15px;
            margin: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
        }
        .chat-thread-item:hover {
            background: #e0e0e0;
        }
        .chat-thread-item.active {
            background: #3A7BD5;
            color: white;
        }
        #output {
            margin: 20px;
            padding: 20px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Click Handler Test</h1>
    <p>This tests if addEventListener works correctly</p>
    
    <div id="container"></div>
    
    <div id="output">Click a student to see output here...</div>
    
    <script>
        const students = [
            {student_id: 1, name: 'Rohan Sharma', roll_number: '2Q34.3'},
            {student_id: 2, name: "O'Brien", roll_number: '2Q34.4'},
            {student_id: 3, name: 'John "Johnny" Doe', roll_number: '2Q34.5'}
        ];
        
        const container = document.getElementById('container');
        const output = document.getElementById('output');
        
        students.forEach(s => {
            const div = document.createElement('div');
            div.className = 'chat-thread-item';
            div.setAttribute('data-student-id', s.student_id);
            
            div.innerHTML = `
                <h4>${s.name}</h4>
                <p>Roll: ${s.roll_number}</p>
            `;
            
            div.addEventListener('click', function(e) {
                // Remove active from all
                document.querySelectorAll('.chat-thread-item').forEach(item => {
                    item.classList.remove('active');
                });
                
                // Add active to clicked
                this.classList.add('active');
                
                // Show output
                output.textContent = `CLICK EVENT FIRED!
                
Student: ${s.name}
ID: ${s.student_id}
Roll: ${s.roll_number}
Event target: ${e.target.tagName}
This element: ${this.className}

✅ Click handler is working correctly!`;
                
                console.log('Clicked:', s.name);
            });
            
            container.appendChild(div);
        });
        
        console.log('Test page loaded. Click a student to test.');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body { margin: 0; background: #b0b8c1; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: #5b6abf; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h5 { margin: 0; font-weight: 600; }
    .btn-logout { background: #e05555; color: white; border: none; padding: 6px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; text-decoration: none; }
    .layout { display: flex; flex: 1; }
    .sidebar { width: 230px; min-width: 230px; background: #2c2f3a; color: #dde1f0; padding: 28px 20px; display: flex; flex-direction: column; }
    .sidebar .faculty-name { font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px; }
    .sidebar .faculty-email { font-size: 12px; color: #7a82a8; margin-bottom: 16px; word-break: break-all; }
    .sidebar .divider { border-top: 1px solid #3e4358; margin: 14px 0; }
    .sidebar .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #7a82a8; font-weight: 600; margin-bottom: 2px; }
    .sidebar .value { font-size: 13px; color: #dde1f0; margin-bottom: 12px; }
    .edit-btn { margin-top: auto; width: 100%; background: #5b6abf; color: white; border: none; padding: 9px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .edit-btn:hover { background: #4a58a8; }
    .main { flex: 1; padding: 32px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card-tile { background: #d0d5de; border-radius: 8px; padding: 32px 24px; cursor: pointer; text-decoration: none; transition: background 0.2s; display: block; }
    .card-tile:hover { background: #c2c8d4; }
    .card-tile h4 { color: #3d4db7; font-weight: 700; margin-bottom: 8px; }
    .card-tile p { color: #444; font-size: 14px; margin: 0; }
    /* Modal */
    .modal-header { background: #5b6abf; color: white; }
    .modal-header .btn-close { filter: invert(1); }
  </style>
</head>
<body>

<meta name="faculty-id" content="{{ faculty_id }}" />

<div class="topbar">
  <h5>Faculty Dashboard</h5>
  <a href="/logout" class="btn-logout">Logout</a>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="faculty-name" id="prof-name">Loading…</div>
    <div class="faculty-email" id="prof-email-display"></div>

    <div class="divider"></div>

    <div class="label">Department ID</div>
    <div class="value" id="prof-dept">—</div>

    <div class="label">Designation</div>
    <div class="value" id="prof-designation">—</div>

    <div class="divider"></div>

    <div class="label">Subjects Taught</div>
    <div id="prof-subjects" style="font-size:13px;color:#dde1f0;margin-bottom:12px">—</div>

    <div class="divider"></div>

    <button class="edit-btn" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
    <div id="update-msg" style="font-size:12px;margin-top:10px;color:#7ddb8f;text-align:center"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="grid">
      <a href="/add_marks" class="card-tile">
        <h4>Add / Update Marks</h4>
        <p>Enter or modify student marks</p>
      </a>
      <a href="/marks_report" class="card-tile">
        <h4>Marks Report</h4>
        <p>View class performance and charts</p>
      </a>
      <a href="/my_classes" class="card-tile">
        <h4>My Classes</h4>
        <div id="classes-list" style="font-size:14px;color:#444;margin-top:8px">Loading…</div>
      </a>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="update-profile-form">
          <div class="mb-3">
            <label class="form-label">Department ID</label>
            <input type="number" id="upd-dept" class="form-control" />
          </div>
          <div class="mb-3">
            <label class="form-label">Designation</label>
            <input type="text" id="upd-designation" class="form-control" />
          </div>
          <button type="submit" class="btn w-100" style="background:#5b6abf;color:white;font-weight:600">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/faculty.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add / Update Marks</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body { margin: 0; background: #b0b8c1; font-family: sans-serif; min-height: 100vh; }
    .topbar { background: #5b6abf; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
    .topbar a { color: white; text-decoration: none; font-size: 14px; opacity: 0.85; }
    .topbar a:hover { opacity: 1; }
    .topbar h5 { margin: 0; font-weight: 600; }
    .btn-logout { background: #e05555; color: white; border: none; padding: 6px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: auto; }
    .content { max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .card-panel { background: #d0d5de; border-radius: 8px; padding: 28px; margin-bottom: 24px; }
    .card-panel h4 { color: #3d4db7; font-weight: 700; margin-bottom: 20px; }
    label { font-size: 13px; color: #333; font-weight: 500; }
    input, select { width: 100%; background: #e8eaf0; border: 1px solid #b0b8c8; border-radius: 4px; padding: 8px 10px; font-size: 14px; margin-top: 4px; margin-bottom: 14px; color: #222; }
    .submit-btn { width: 100%; background: #5b6abf; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: 600; }
    .submit-btn:hover { background: #4a58a8; }
    .submit-btn.green { background: #3a9e6e; }
    .submit-btn.green:hover { background: #2e8059; }
    .msg { font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/">← Back</a>
  <h5>Add / Update Marks</h5>
  <a href="/logout" class="btn-logout">Logout</a>
</div>

<div class="content">

  <div class="card-panel">
    <h4>Add Marks</h4>
    <form id="add-marks-form" novalidate>
      <label>Student ID</label>
      <input type="number" id="add-student-id" required />
      <label>Subject ID</label>
      <input type="number" id="add-subject-id" required />
      <label>Marks Obtained (0–100)</label>
      <input type="number" step="0.01" min="0" max="100" id="add-marks-obtained" required />
      <label>Exam Type</label>
      <select id="add-exam-type" required>
        <option value="">— select —</option>
        <option value="midterm">Midterm</option>
        <option value="final">Final</option>
        <option value="internal">Internal</option>
      </select>
      <div id="add-error" class="msg" style="color:#c0392b;display:none"></div>
      <button type="submit" class="submit-btn">Add Marks</button>
    </form>
  </div>

  <div class="card-panel">
    <h4>Update Marks</h4>
    <form id="update-marks-form" novalidate>
      <label>Marks ID</label>
      <input type="number" id="upd-marks-id" required />
      <label>New Marks Obtained (0–100)</label>
      <input type="number" step="0.01" min="0" max="100" id="upd-marks-obtained" required />
      <div id="upd-error" class="msg" style="color:#c0392b;display:none"></div>
      <div id="upd-success" class="msg" style="color:#27ae60;display:none"></div>
      <button type="submit" class="submit-btn green">Update Marks</button>
    </form>
  </div>

</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/marks.js"></script>
</body>
</html>

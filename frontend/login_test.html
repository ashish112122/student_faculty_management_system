<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Login - Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div style="text-align: center;">
                <h1 style="color: white; font-size: 48px; margin-bottom: 20px;"><i class="fa-solid fa-graduation-cap"></i></h1>
                <h1 style="color: white; font-size: 36px;">Thapar University</h1>
                <p style="color: rgba(255,255,255,0.8); font-size: 18px; margin-top: 10px;">Student Management System</p>
            </div>
        </div>
        <div class="right-section">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            <div id="error-message" class="error"></div>
            <div id="success-message" style="color: green; margin-top: 10px; display: none;"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            errorDiv.textContent = '';
            errorDiv.style.display = 'none';
            successDiv.textContent = '';
            successDiv.style.display = 'none';
            
            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store data
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('name', data.name);
                    
                    // Show success and redirect
                    successDiv.textContent = `Login successful! Redirecting...`;
                    successDiv.style.display = 'block';
                    
                    // Redirect after 1 second
                    setTimeout(() => {
                        if (data.role === 'student') {
                            window.location.href = 'student_portal.html';
                        } else if (data.role === 'faculty') {
                            window.location.href = 'faculty_portal.html';
                        }
                    }, 1000);
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection error. Make sure backend is running on http://localhost:5000';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>

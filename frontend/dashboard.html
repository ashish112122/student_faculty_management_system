<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <h3 id="studentName">Loading...</h3>
            <div class="student-info">
                <p><strong>Branch:</strong> <span id="branch"></span></p>
                <p><strong>Year:</strong> <span id="year"></span></p>
                <p><strong>Semester:</strong> <span id="semester"></span></p>
                <p><strong>Section:</strong> <span id="section"></span></p>
                <p><strong>CGPA:</strong> <span id="cgpa"></span></p>
            </div>
            <div class="subjects">
                <h4>Current Subjects</h4>
                <ul id="subjectList"></ul>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <button class="toggle-btn" id="toggleBtn">☰</button>
            <h1>Student Dashboard</h1>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
        
        <div class="dashboard-cards">
            <div class="card" onclick="location.href='marks.html'">
                <h2>Marks</h2>
                <p>View your academic performance</p>
            </div>
            <div class="card" onclick="location.href='attendance.html'">
                <h2>Attendance</h2>
                <p>Track your attendance records</p>
            </div>
            <div class="card" onclick="location.href='alerts.html'">
                <h2>Alerts</h2>
                <p>View important notifications</p>
            </div>
            <div class="card" onclick="location.href='feedback.html'">
                <h2>Feedback</h2>
                <p>Communicate with faculty</p>
            </div>
        </div>
    </div>
    
    <script src="js/dashboard.js"></script>
</body>
</html>

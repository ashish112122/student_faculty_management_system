<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-box {
            border: 2px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #5568d3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Login Diagnostic Test</h1>
    
    <div class="test-box">
        <h2>Test Login</h2>
        <form id="testForm">
            <input type="email" id="email" placeholder="Email" value="rohan.sharma@thapar.edu">
            <input type="password" id="password" placeholder="Password" value="password123">
            <button type="submit">Test Login</button>
        </form>
        <div id="result"></div>
    </div>

    <div class="test-box">
        <h2>Console Output</h2>
        <div id="console" style="background: #f5f5f5; padding: 10px; border-radius: 5px; min-height: 100px; font-family: monospace; font-size: 12px;"></div>
    </div>

    <script>
        const consoleDiv = document.getElementById('console');
        const resultDiv = document.getElementById('result');

        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;

        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleDiv.innerHTML += '<div style="color: blue;">[LOG] ' + args.join(' ') + '</div>';
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            consoleDiv.innerHTML += '<div style="color: red;">[ERROR] ' + args.join(' ') + '</div>';
        };

        console.log('Test page loaded');
        console.log('Backend URL: http://localhost:5000/api/login');

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            console.log('=== Login Test Started ===');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Email:', email);
            console.log('Password:', password ? '***' : '(empty)');
            
            resultDiv.innerHTML = '<p>Testing login...</p>';
            
            try {
                console.log('Sending POST request...');
                
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Response received');
                console.log('Status:', response.status);
                console.log('Status Text:', response.statusText);
                
                const data = await response.json();
                console.log('Response data:', JSON.stringify(data, null, 2));
                
                if (response.ok) {
                    console.log('✅ Login successful!');
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Login Successful!</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                            <p><strong>Token:</strong> ${data.token ? data.token.substring(0, 20) + '...' : 'N/A'}</p>
                            <p><strong>User ID:</strong> ${data.user_id}</p>
                            <p><strong>Role:</strong> ${data.role}</p>
                            <p><strong>Name:</strong> ${data.name}</p>
                        </div>
                    `;
                } else {
                    console.log('❌ Login failed');
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Login Failed</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Connection error:', error.message);
                console.error('Error details:', error);
                
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Connection Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p><strong>Possible causes:</strong></p>
                        <ul>
                            <li>Backend is not running</li>
                            <li>Backend is on wrong port</li>
                            <li>CORS issue</li>
                            <li>Network problem</li>
                        </ul>
                        <p><strong>Solution:</strong></p>
                        <pre>cd backend
python app.py</pre>
                    </div>
                `;
            }
            
            console.log('=== Login Test Completed ===');
        });

        // Test backend connectivity on page load
        window.addEventListener('load', async () => {
            console.log('Testing backend connectivity...');
            try {
                const response = await fetch('http://localhost:5000/api/student/faculty');
                console.log('Backend is reachable! Status:', response.status);
                if (response.status === 401) {
                    console.log('✅ Backend is running (401 is expected without token)');
                }
            } catch (error) {
                console.error('❌ Cannot reach backend:', error.message);
                console.error('Make sure backend is running: cd backend && python app.py');
            }
        });
    </script>
</body>
</html>

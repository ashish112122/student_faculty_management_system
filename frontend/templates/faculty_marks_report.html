<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/faculty.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <h1>Marks Report</h1>
        </div>

        <!-- Class Selection -->
        <div id="class-selection" class="content-section">
            <h2>Select Your Class</h2>
            <div id="class-grid" class="grid"></div>
        </div>

        <!-- Report View -->
        <div id="report-view" class="content-section" style="display:none">
            <h2 id="report-title"></h2>
            <div id="no-data" class="empty-message" style="display:none">No marks data available for this class</div>
            <div id="reports-container"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/faculty_marks_report.js') }}"></script>
</body>
</html>

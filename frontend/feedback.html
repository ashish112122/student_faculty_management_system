<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="css/feedback.css">
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="location.href='dashboard.html'">← Back</button>
        <h1>Feedback</h1>
    </div>
    
    <div class="content">
        <div id="subjectList" class="subject-list"></div>
        <div id="conversationView" class="conversation-view" style="display:none;">
            <div class="conversation-header">
                <button class="back-btn" onclick="backToSubjectList()">← Back to Subjects</button>
                <h2 id="subjectName"></h2>
            </div>
            <div id="messageThread" class="message-thread"></div>
            <div class="message-input">
                <textarea id="messageText" placeholder="Type your message..."></textarea>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script src="js/feedback.js"></script>
</body>
</html>
